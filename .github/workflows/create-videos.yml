name: Create Videos

on:
  workflow_dispatch:

jobs:
  create-videos:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install pillow google-api-python-client google-auth google-auth-oauthlib requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create work directories
        run: |
          mkdir -p work/source
          mkdir -p work/output
          mkdir -p work/youtube

      - name: Download AI-ready content
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONTENT_SPREADSHEET_ID: ${{ secrets.CONTENT_SPREADSHEET_ID }}
        run: |
          python scripts/download_from_drive.py

      - name: Check for new videos
        id: check_videos
        run: |
          if [ -f work/content_manifest.json ] && [ "$(python -c "import json; print(len(json.load(open('work/content_manifest.json'))))")" -gt 0 ]; then
            echo "has_new_videos=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_videos=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create videos
        if: steps.check_videos.outputs.has_new_videos == 'true'
        run: |
          python video/create_video.py

      - name: Upload newly created videos to Google Drive
        if: steps.check_videos.outputs.has_new_videos == 'true'
        env:
          VIDEO_UPLOAD_URL: ${{ secrets.VIDEO_UPLOAD_URL }}
          VIDEO_UPLOAD_TOKEN: ${{ secrets.VIDEO_UPLOAD_TOKEN }}
          VIDEO_FOLDER_ID: ${{ secrets.VIDEO_FOLDER_ID }}
        run: |
          python scripts/upload_to_drive.py

      - name: Publish scheduled YouTube videos
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONTENT_SPREADSHEET_ID: ${{ secrets.CONTENT_SPREADSHEET_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_publish.py
