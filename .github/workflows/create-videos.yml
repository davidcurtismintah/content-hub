name: Create Videos

on:
  workflow_dispatch:

jobs:
  create-videos:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install pillow google-api-python-client google-auth google-auth-oauthlib requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create work directories
        run: |
          mkdir -p work/source
          mkdir -p work/output

      - name: Download AI-ready content
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONTENT_SPREADSHEET_ID: ${{ secrets.CONTENT_SPREADSHEET_ID }}
        run: |
          python scripts/download_from_drive.py

      - name: Create videos
        run: |
          python video/create_video.py

      - name: Upload videos to Google Drive
        env:
          VIDEO_UPLOAD_URL: ${{ secrets.VIDEO_UPLOAD_URL }}
          VIDEO_UPLOAD_TOKEN: ${{ secrets.VIDEO_UPLOAD_TOKEN }}
          VIDEO_FOLDER_ID: ${{ secrets.VIDEO_FOLDER_ID }}
        run: |
          python scripts/upload_to_drive.py

      - name: Publish scheduled YouTube videos
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONTENT_SPREADSHEET_ID: ${{ secrets.CONTENT_SPREADSHEET_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/youtube_publish.py
